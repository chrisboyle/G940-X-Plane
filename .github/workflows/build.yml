name: Build, test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            shell: bash
          - os: macos-14
            platform: mac
            arch: universal
            shell: bash
          - os: windows-2022
            platform: windows
            arch: x86_64
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        if: matrix.platform == 'windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            curl
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Build both plugins
        run: make -j2 PLATFORM=${{ matrix.platform }} BUILD_TYPE=release
      - name: Test protocol, datarefs, lifecycle, installation and packaging
        run: make test PLATFORM=${{ matrix.platform }} BUILD_TYPE=release
      - name: Build debug plugins separately
        run: make -j2 PLATFORM=${{ matrix.platform }} BUILD_TYPE=debug BUILDDIR=build/debug CPPFLAGS=-DG940_DEBUG_FORCE=1
      - name: Package for X-Plane
        run: python3 -m tools.package --platform ${{ matrix.platform }} --output build/dist/G940-X-Plane-${{ matrix.platform }}-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v7
        with:
          path: build/dist/G940-X-Plane-${{ matrix.platform }}-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
